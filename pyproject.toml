[project]
name = "teach-agent"
version = "0.1.0"
description = "本地教材答疑 Agent（DeepAgents + RAG + 教学技能，CLI 与 Web 双入口）。"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.25.0",
    "chromadb>=0.5.0,<1.0.0",
    "transformers>=4.51.0",
    "torch>=2.6.0",
    "numpy<2.3.0",
    "python-dotenv>=1.0.0",
    "deepagents>=0.5.3",
    "langchain-openai>=0.3",
    "tavily-python>=0.5",
    "langgraph-checkpoint-sqlite>=3.1.1",
    # M3 Web 异步入口（astream_events）必须用 AsyncSqliteSaver，依赖 aiosqlite
    "aiosqlite>=0.20",
    "langsmith>=0.14",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teach_agent"]

# PyPI 官方源在本机网络不可达，统一走清华镜像
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
